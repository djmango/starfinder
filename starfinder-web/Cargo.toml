[package]
name = "starfinder-web"
version = "1.0.0"
edition = "2024"

[dependencies]
actix-files = "0.6.6"
actix-web = "4.3.1"
image = "0.25.2"
serde = { version = "1.0.210", features = ["derive"] }
starfinder = { path = "../" }
tokio = { version = "1.26.0", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.40"
tracing-subscriber = "0.3"

[build-dependencies]
directories = "6.0"
reqwest = { version = "0.12", features = ["blocking"] }
